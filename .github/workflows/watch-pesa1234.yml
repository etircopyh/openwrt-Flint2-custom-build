name: Watch for New Pesa1234 Releases

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

env:
  UPSTREAM_REPO: pesa1234/openwrt
  WORKFLOW_FILE: .github/workflows/openwrt-SNAPSHOT-mt76.yml

jobs:
  check-for-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      new_branch: ${{ steps.check.outputs.new_branch }}
      current_branch: ${{ steps.check.outputs.current_branch }}
      should_update: ${{ steps.check.outputs.should_update }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Check for new branches
        id: check
        run: |
          # Accept both the expression form and a literal branch value.
          CURRENT_BRANCH=$(python3 - "$WORKFLOW_FILE" <<'PY'
          import re
          import sys

          text = open(sys.argv[1], encoding="utf-8").read()
          match = re.search(
              r"repo_branch:\s*(?:\$\{\{\s*inputs\.branch_override\s*\|\|\s*'([^']+)'\s*\}\}|[\"']?([^'\"\s}]+))",
              text,
          )
          print((match.group(1) or match.group(2)) if match else "")
          PY
          )
          echo "Current branch: $CURRENT_BRANCH"
          echo "current_branch=$CURRENT_BRANCH" >> $GITHUB_OUTPUT

          # Fetch all branches from upstream
          echo "Fetching branches from $UPSTREAM_REPO..."
          BRANCHES=$(curl -s -H "Authorization: token ${{ github.token }}" \
            "https://api.github.com/repos/$UPSTREAM_REPO/branches?per_page=100" | \
            jq -r '.[].name' | grep -E '^next-r[0-9]+(\.[0-9]+)+\.rss\.mtk$' | sort -V)

          if [ -z "$BRANCHES" ]; then
            echo "No version branches found"
            echo "should_update=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Available version branches:"
          echo "$BRANCHES"

          # Get the latest version branch
          LATEST_BRANCH=$(echo "$BRANCHES" | tail -1)
          echo "Latest branch: $LATEST_BRANCH"

          # Compare current vs latest
          if [ "$CURRENT_BRANCH" != "$LATEST_BRANCH" ]; then
            echo "New version detected!"
            echo "new_branch=$LATEST_BRANCH" >> $GITHUB_OUTPUT
            echo "should_update=true" >> $GITHUB_OUTPUT
          else
            echo "No new version available"
            echo "should_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Update workflow file
        if: steps.check.outputs.should_update == 'true'
        run: |
          NEW_BRANCH="${{ steps.check.outputs.new_branch }}"
          CURRENT_BRANCH="${{ steps.check.outputs.current_branch }}"
          export NEW_BRANCH CURRENT_BRANCH WORKFLOW_FILE

          echo "Updating workflow from $CURRENT_BRANCH to $NEW_BRANCH"

          # Update branch values whether they are expressions or literals.
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          workflow_file = Path(os.environ["WORKFLOW_FILE"])
          new_branch = os.environ["NEW_BRANCH"]
          text = workflow_file.read_text()

          def set_branch(text, key):
              pattern = (
                  r"(" + re.escape(key) + r":\s*)"
                  r"(?:\$\{\{\s*inputs\.branch_override\s*\|\|\s*'[^']*'\s*\}\}"
                  r"|\"[^\"]*\"|'[^']*'|[^\s#]+)"
              )
              replacement = r"\1${{ inputs.branch_override || '" + new_branch + "' }}"
              updated, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"Could not update {key} in {workflow_file}")
              return updated

          text = set_branch(text, "repo_branch")
          text = set_branch(text, "source_branch")
          workflow_file.write_text(text)
          PY

          # Verify the change
          grep -E "repo_branch:|source_branch:" "$WORKFLOW_FILE"

      - name: Update README
        if: steps.check.outputs.should_update == 'true'
        run: |
          NEW_BRANCH="${{ steps.check.outputs.new_branch }}"

          echo "Updating README.md..."

          # Replace whatever pesa1234 branch the README currently references.
          sed -i -E "s|(https://github.com/pesa1234/openwrt/tree/)[^ ]+|\\1${NEW_BRANCH}|g" README.md

          # Verify the change
          grep "OpenWRT (pesa1234)" -A1 README.md | head -2

      - name: Commit and push changes
        id: commit
        if: steps.check.outputs.should_update == 'true'
        continue-on-error: true
        env:
          WORKFLOW_PUSH_TOKEN: ${{ secrets.WORKFLOW_PUSH_TOKEN }}
        run: |
          NEW_BRANCH="${{ steps.check.outputs.new_branch }}"
          CURRENT_BRANCH="${{ steps.check.outputs.current_branch }}"

          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'

          git add "$WORKFLOW_FILE"
          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update pesa1234 branch from $CURRENT_BRANCH to $NEW_BRANCH - auto-detected new upstream release"

          if [ -z "$WORKFLOW_PUSH_TOKEN" ]; then
            echo "WORKFLOW_PUSH_TOKEN is not configured; skipping push (build will still be dispatched)"
            exit 0
          fi
          git push "https://x-access-token:${WORKFLOW_PUSH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${{ github.ref_name }}"
          echo "Changes committed and pushed"

      - name: Trigger build workflow
        if: steps.check.outputs.should_update == 'true'
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: openwrt-SNAPSHOT-mt76.yml
          token: ${{ github.token }}
          inputs: '{"branch_override": "${{ steps.check.outputs.new_branch }}"}'

      - name: Summary
        run: |
          echo "## Branch Watch Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.should_update }}" == "true" ]; then
            echo "✅ **New version detected!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- Current: \`${{ steps.check.outputs.current_branch }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- New: \`${{ steps.check.outputs.new_branch }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Build workflow has been triggered automatically." >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.commit.outcome }}" = "failure" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "⚠️ **Workflow/README push failed.** The build was dispatched with the branch override; check \`WORKFLOW_PUSH_TOKEN\` (contents + workflow scope)." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⏸️ No new versions detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Current branch: \`${{ steps.check.outputs.current_branch }}\`" >> $GITHUB_STEP_SUMMARY
          fi
