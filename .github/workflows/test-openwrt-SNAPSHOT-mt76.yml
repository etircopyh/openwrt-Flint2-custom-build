name: TEST OpenWRT SNAPSHOT Firmware mt76 driver (pesa1234)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      repo_url: https://github.com/pesa1234/openwrt.git
      repo_branch: next-r4.6.14.rss.mtk
      config_file: config.test-openwrt-snapshot-pesa1234
      source_dir: openwrt
      patch_feeds_mk: true
      feeds_mk_type: openwrt-apk

  prepare:
    needs: build
    uses: ./.github/workflows/reusable-prepare-packages.yml
    with:
      date: ${{ needs.build.outputs.date }}
      version_code: ${{ needs.build.outputs.version_code }}
      openwrt_version: ${{ needs.build.outputs.openwrt_version }}
      kernel_version: ${{ needs.build.outputs.kernel_version }}
      target_pkg_dir: ${{ needs.build.outputs.target_pkg_dir }}
      firmware_name: openwrt-snapshot-test-pesa1234
      device_name: Flint2_GL-MT6000
      source_branch: next-r4.6.14.rss.mtk

  deploy:
    needs: [build, prepare]
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      date: ${{ needs.build.outputs.date }}
      firmware_name: openwrt-snapshot-test-pesa1234
      device_name: Flint2_GL-MT6000
      openwrt_version: ${{ needs.build.outputs.openwrt_version }}
      kernel_version: ${{ needs.build.outputs.kernel_version }}
      buildinfo: ${{ needs.build.outputs.buildinfo }}
      packages_dir_name: ${{ needs.prepare.outputs.packages_dir_name }}
      package_count: ${{ needs.prepare.outputs.package_count }}
      packages_archive: ${{ needs.prepare.outputs.packages_archive }}
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
