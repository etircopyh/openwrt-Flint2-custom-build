name: OpenWRT SNAPSHOT Firmware mt76 driver (pesa1234)

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/pesa1234/openwrt.git
  REPO_BRANCH: next-r4.6.14.rss.mtk
  OpenWRTDevice: Flint2_GL-MT6000
  CONFIG_FILE: test-config.openwrt-snapshot-pesa1234
  TZ: Europe/Kyiv

jobs:
  build-firmware:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full history instead of single commit
          ref: ${{ github.ref }}

      - name: Free up disk space
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune --all --force
          sudo -E apt-get -qq update
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown -R $(whoami):$(id -gn) /workdir
          df -h

      - name: Set up OpenWRT Environment
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone --branch $REPO_BRANCH $REPO_URL
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3-distutils \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            llvm \
            libpcre3 \
            libpcre3-dev \
            zstd \
            mold

      - name: Display contents of .config start
        run:  |
          cat $GITHUB_WORKSPACE/$CONFIG_FILE

      - name: Update & Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Firmware
        run: |
          cp $CONFIG_FILE openwrt/.config
          cd openwrt
          perl --version
          cat target/linux/mediatek/Makefile | grep KERNEL
          head -n 200 scripts/kconfig.pl
          make defconfig
          cat .config

      - name: Extract Version Information
        run: |
          cd openwrt

          # Extract OpenWRT version from the source
          OpenWRT_VERSION="SNAPSHOT"

          # Extract kernel version from target configuration
          KERNEL_VERSION=""

          if [ -z "$KERNEL_VERSION" ]; then
            if grep 'HAS_TESTING_KERNEL=y' .config; then
              KERNEL_VERSION=$(grep -m1 "KERNEL_TESTING_PATCHVER:" target/linux/mediatek/Makefile 2>/dev/null | cut -d= -f2 | tr -d ' ' | cut -d. -f1-2)
            else
              KERNEL_VERSION=$(grep -m1 "KERNEL_PATCHVER:" target/linux/mediatek/Makefile 2>/dev/null | cut -d= -f2 | tr -d ' ' | cut -d. -f1-2)
            fi
          fi

          # Set default values if extraction fails
          OpenWRT_VERSION=${OpenWRT_VERSION:-"SNAPSHOT"}
          KERNEL_VERSION=${KERNEL_VERSION:-"6.12"}

          # Clean up version strings
          OpenWRT_VERSION=$(echo "$OpenWRT_VERSION" | sed 's/[^a-zA-Z0-9.-]//g')
          KERNEL_VERSION=$(echo "$KERNEL_VERSION" | sed 's/[^0-9.]//g')

          # Export to environment
          echo "OpenWRT_VERSION=$OpenWRT_VERSION" >> $GITHUB_ENV
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV

          echo "Extracted OpenWRT Version: $OpenWRT_VERSION"
          echo "Extracted Kernel Version: $KERNEL_VERSION"

      - name: Set target directory variables
        run: |
          cd openwrt

          # Set DATE variable for deployment path
          echo "DATE=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV

          # Set VERSION_CODE (extract from version info or default)
          VERSION_CODE=$(git rev-parse --short HEAD)
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

          echo "Build variables set:"
          echo "DATE: $(date +%Y%m%d_%H%M%S)"
          echo "VERSION_CODE: $VERSION_CODE"

      - name: Create target deploy dirs
        run: |
          # Create versioned directory name
          PACKAGES_DIR_NAME="${DATE}_openwrt_${VERSION_CODE}_${OPENWRT_VERSION}-kernel-${KERNEL_VERSION}"
          TARGET_PKG_DIR="$(grep '^CONFIG_TARGET_BOARD=' openwrt/.config | cut -d= -f2 | tr -d '\"')/$(grep '^CONFIG_TARGET_SUBTARGET=' openwrt/.config | cut -d= -f2 | tr -d '\"')"
          PACKAGES_OUT="${PACKAGES_DIR_NAME}/targets/${TARGET_PKG_DIR}/packages"
          mkdir -p "${PACKAGES_OUT}"

          echo "PACKAGES_DIR_NAME=$PACKAGES_DIR_NAME" >> $GITHUB_ENV
          echo "TARGET_PKG_DIR=$TARGET_PKG_DIR" >> $GITHUB_ENV
          echo "PACKAGES_OUT=$PACKAGES_OUT" >> $GITHUB_ENV

      - name: Patch feeds.mk for custom package repository
        run: |
          cd openwrt
          # Update APK core package path
          sed -i "s|echo '%U/\$(DATE)_\$(VERSION_CODE)_\$(BRANCH)/targets/%S/packages/packages.adb';|echo '%U/${PACKAGES_OUT}/packages.adb';|" include/feeds.mk
          echo "feeds.mk patched successfully"

      - name: Download Sources
        run: |
          cd openwrt
          make download -j$(nproc) || { echo "Download failed"; exit 1; }
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Build Firmware
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s

      - name: Prepare packages
        run: |
          cd openwrt
          BUILD_DIR=$(ls -d bin/$(date +"%Y-%m-%d")_*)
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV
          echo "Actual build path: $BUILD_DIR"

          PACKAGE_COUNT=$(find "${BUILD_DIR}/targets/*/*/packages" -name "*.ipk" | wc -l 2>/dev/null || echo 0)
          echo "PACKAGE_COUNT=$PACKAGE_COUNT" >> $GITHUB_ENV
          echo "Found $PACKAGE_COUNT .ipk packages"

          mkdir -p "${PACKAGES_OUT}"
          cp -v "${BUILD_DIR}"/targets/*/*/packages/*.ipk "${PACKAGES_OUT}/" 2>/dev/null || true

          ls "${BUILD_DIR}/targets/*/*"
          ls -l "${PACKAGES_OUT}" || true

          # Create README with version info
          REPO_NAME="${{ github.repository }}"
          BRANCH_NAME="${{ github.ref_name }}"
          {
            echo "# OpenWRT Packages"
            echo ""
            echo "Generated on: ${DATE}"
            echo "Device: ${OpenWRTDevice}"
            echo "OpenWRT Version: ${OpenWRT_VERSION}"
            echo "Kernel Version: ${KERNEL_VERSION}"
            echo "Source Branch: ${REPO_BRANCH}"
            echo "Deploy Path: ${PACKAGES_DIR_NAME}"
            echo ""
            echo "## Package Repository Configuration"
            echo ""
            echo "Add this to your OpenWRT device's /etc/opkg/distfeeds.conf:"
            echo ""
            echo 'src/gz openwrt_core https://raw.githubusercontent.com/'"${REPO_NAME}/${BRANCH_NAME}/${PACKAGES_OUT}"
            echo ""
            echo "The URL points to the packages directory."
            echo ""
            echo "## Package List"
          } > "${PACKAGES_DIR_NAME}/README.md"

          if [ "$PACKAGE_COUNT" -gt 0 ]; then
            find "${PACKAGES_OUT}" -name "*.ipk" -type f | sort | while read -r pkg; do
              PKG_NAME=$(basename "$pkg")
              PKG_SIZE=$(du -h "$pkg" | cut -f1)
              echo "- ${PKG_NAME} (${PKG_SIZE})" >> "${PACKAGES_DIR_NAME}/README.md"
            done
          else
            echo "No packages available." >> "${PACKAGES_DIR_NAME}/README.md"
          fi

      - name: Create symlink for deployment
        if: env.PACKAGE_COUNT != '0'
        run: |
          ln -sf "${PACKAGES_DIR_NAME}/targets/${TARGET_PKG_DIR}/packages" packages-output-openwrt-snapshot-pesa1234

      - name: Prepare firmware artifact
        run: |
          cd openwrt
          TARGET_DIR="${BUILD_DIR}/targets/mediatek/filogic"
          cd "$TARGET_DIR"

          if [ -d "packages" ]; then
            PACKAGES_ARCHIVE="openwrt-packages-${DATE}-v${OpenWRT_VERSION}-k${KERNEL_VERSION}.tar.gz"
            tar -czf "${GITHUB_WORKSPACE}/${PACKAGES_ARCHIVE}" packages/
            echo "Created archive: ${PACKAGES_ARCHIVE}"
          fi

          rm -rf packages
          echo "FIRMWARE=$(pwd)" >> $GITHUB_ENV
          cp version.buildinfo "${GITHUB_WORKSPACE}/"
          echo "NOW=$(date +%F-%H%M)" >> $GITHUB_ENV

      - name: Extract version information from version.buildinfo
        run: |
          echo "BUILDINFO=$(cat version.buildinfo)" >> $GITHUB_ENV

      - name: Upload firmware to artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build
          path: ${{ env.FIRMWARE }}

      - name: Upload packages archive as artifact
        if: env.PACKAGE_COUNT != '0'
        uses: actions/upload-artifact@v4
        with:
          name: packages-archive-build
          path: ${{ env.PACKAGES_ARCHIVE }}

      - name: Upload packages for deployment
        if: env.PACKAGE_COUNT != '0'
        uses: actions/upload-artifact@v4
        with:
          name: packages-deploy
          path: |
            ${{ env.PACKAGES_DIR_NAME }}
            packages-output-openwrt-snapshot-pesa1234

      - name: Set job outputs
        id: outputs
        run: |
          echo "package_count=${PACKAGE_COUNT}" >> $GITHUB_OUTPUT
          echo "openwrt_version=${OpenWRT_VERSION}" >> $GITHUB_OUTPUT
          echo "kernel_version=${KERNEL_VERSION}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "now=${NOW}" >> $GITHUB_OUTPUT
          echo "buildinfo=${BUILDINFO}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "packages_dir_name=${PACKAGES_DIR_NAME}" >> $GITHUB_OUTPUT
          echo "target_pkg_dir=${TARGET_PKG_DIR}" >> $GITHUB_OUTPUT

  deploy-release:
    needs: build-firmware
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set env vars
        run: |
          echo "OpenWRT_VERSION=${{ needs.build-firmware.outputs.openwrt_version }}" >> $GITHUB_ENV
          echo "KERNEL_VERSION=${{ needs.build-firmware.outputs.kernel_version }}" >> $GITHUB_ENV
          echo "DATE=${{ needs.build-firmware.outputs.date }}" >> $GITHUB_ENV
          echo "NOW=${{ needs.build-firmware.outputs.now }}" >> $GITHUB_ENV
          echo "BUILDINFO=${{ needs.build-firmware.outputs.buildinfo }}" >> $GITHUB_ENV
          echo "PACKAGES_DIR_NAME=${{ needs.build-firmware.outputs.packages_dir_name }}" >> $GITHUB_ENV
          echo "TARGET_PKG_DIR=${{ needs.build-firmware.outputs.target_pkg_dir }}" >> $GITHUB_ENV
          echo "PACKAGE_COUNT=${{ needs.build-firmware.outputs.package_count }}" >> $GITHUB_ENV
          if [ "${PACKAGE_COUNT}" != "0" ]; then
            echo "PACKAGES_ARCHIVE=openwrt-packages-${DATE}-v${OpenWRT_VERSION}-k${KERNEL_VERSION}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-build
          path: firmware

      - name: Download packages archive
        if: needs.build-firmware.outputs.package_count != '0'
        uses: actions/download-artifact@v4
        with:
          name: packages-archive-build
          path: .

      - name: Download packages for deploy
        if: needs.build-firmware.outputs.package_count != '0'
        uses: actions/download-artifact@v4
        with:
          name: packages-deploy
          path: .

      - name: Deploy and archive packages
        if: needs.build-firmware.outputs.package_count != '0'
        run: |
          git config --global user.name 'OpenWRT Build Bot'
          git config --global user.email 'actions@github.com'

          rm -f packages-output-openwrt-snapshot-pesa1234

          git pull origin ${{ github.ref_name }} --rebase --autostash || true

          git add "${PACKAGES_DIR_NAME}/"
          git add packages-output-openwrt-snapshot-pesa1234

          if ! git diff --staged --quiet; then
            git commit -m "[ci skip] Update packages (${PACKAGE_COUNT} .ipk files) - OpenWRT ${OpenWRT_VERSION} / Kernel ${KERNEL_VERSION}"
            git push origin ${{ github.ref_name }}
            echo "Successfully deployed ${PACKAGE_COUNT} packages"
          else
            echo "No changes detected in packages"
          fi

      - name: Build RelTag
        run: |
          echo "RelTag=${NOW}_OpenWRT-${OpenWRT_VERSION}_Kernel-${KERNEL_VERSION}_${OpenWRTDevice}" >> $GITHUB_ENV

      - name: Create a release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          title: "${{ env.RelTag }}"
          automatic_release_tag: "${{ env.BUILDINFO }}"
          files: |
            firmware/*.bin
            firmware/*.buildinfo
            firmware/*.manifest
            firmware/sha256sums
            ${{ env.PACKAGES_ARCHIVE }}
