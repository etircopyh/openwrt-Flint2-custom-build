name: OpenWRT SNAPSHOT Firmware mt76 driver (pesa1234) - Optimized

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 0'

env:
  REPO_URL: https://github.com/pesa1234/openwrt.git
  REPO_BRANCH: next-r4.6.14.rss.mtk
  OpenWRTDevice: Flint2_GL-MT6000
  CONFIG_FILE: config.openwrt-snapshot-pesa1234
  TZ: Europe/Kyiv

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- JOB 1: Environment Setup ---
  setup:
    runs-on: ubuntu-22.04
    outputs:
      packages_dir_name: ${{ steps.variables.outputs.packages_dir_name }}
      target_pkg_dir: ${{ steps.variables.outputs.target_pkg_dir }}
      packages_out: ${{ steps.variables.outputs.packages_out }}
      openwrt_version: ${{ steps.variables.outputs.openwrt_version }}
      kernel_version: ${{ steps.variables.outputs.kernel_version }}
      version_code: ${{ steps.variables.outputs.version_code }}
      build_date: ${{ steps.variables.outputs.build_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Free up disk space
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune --all --force
          sudo -E apt-get -qq update
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          df -h

      - name: Set up OpenWRT Environment
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone --branch $REPO_BRANCH $REPO_URL
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3-distutils \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            llvm \
            libpcre3 \
            libpcre3-dev \
            zstd \
            mold

      - name: Display contents of .config start
        run: |
          cat $GITHUB_WORKSPACE/$CONFIG_FILE

      - name: Update & Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Firmware
        run: |
          cp $CONFIG_FILE openwrt/.config
          cd openwrt
          perl --version
          cat target/linux/mediatek/Makefile | grep KERNEL
          head -n 200 scripts/kconfig.pl
          make defconfig
          cat .config

      - name: Extract Version Information
        id: version-info
        run: |
          cd openwrt

          # Extract OpenWRT version from the source
          OpenWRT_VERSION="SNAPSHOT"

          # Extract kernel version from target configuration
          KERNEL_VERSION=""

          if [ -z "$KERNEL_VERSION" ]; then
            if grep 'HAS_TESTING_KERNEL=y' .config; then
              KERNEL_VERSION=$(grep -m1 "KERNEL_TESTING_PATCHVER:" target/linux/mediatek/Makefile 2>/dev/null | cut -d= -f2 | tr -d ' ' | cut -d. -f1-2)
            else
              KERNEL_VERSION=$(grep -m1 "KERNEL_PATCHVER:" target/linux/mediatek/Makefile 2>/dev/null | cut -d= -f2 | tr -d ' ' | cut -d. -f1-2)
            fi
          fi

          # Set default values if extraction fails
          OpenWRT_VERSION=${OpenWRT_VERSION:-"SNAPSHOT"}
          KERNEL_VERSION=${KERNEL_VERSION:-"6.12"}

          # Clean up version strings
          OpenWRT_VERSION=$(echo "$OpenWRT_VERSION" | sed 's/[^a-zA-Z0-9.-]//g')
          KERNEL_VERSION=$(echo "$KERNEL_VERSION" | sed 's/[^0-9.]//g')

          echo "OpenWRT_VERSION=$OpenWRT_VERSION" >> $GITHUB_ENV
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV

          echo "Extracted OpenWRT Version: $OpenWRT_VERSION"
          echo "Extracted Kernel Version: $KERNEL_VERSION"

      - name: Set build variables
        id: variables
        run: |
          cd openwrt

          # Set DATE variable for deployment path
          BUILD_DATE=$(date +%Y%m%d_%H%M%S)
          echo "DATE=$BUILD_DATE" >> $GITHUB_ENV

          # Set VERSION_CODE (extract from version info or default)
          VERSION_CODE=$(git rev-parse --short HEAD)
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

          # Create versioned directory name
          PACKAGES_DIR_NAME="${BUILD_DATE}_openwrt_${VERSION_CODE}_${OpenWRT_VERSION}-kernel-${KERNEL_VERSION}"
          TARGET_PKG_DIR="$(grep '^CONFIG_TARGET_BOARD=' .config | cut -d= -f2 | tr -d '\"')/$(grep '^CONFIG_TARGET_SUBTARGET=' .config | cut -d= -f2 | tr -d '\"')"
          PACKAGES_OUT="${PACKAGES_DIR_NAME}/targets/${TARGET_PKG_DIR}/packages"
          mkdir -p "${PACKAGES_OUT}"

          # Set outputs for other jobs
          echo "packages_dir_name=$PACKAGES_DIR_NAME" >> $GITHUB_OUTPUT
          echo "target_pkg_dir=$TARGET_PKG_DIR" >> $GITHUB_OUTPUT
          echo "packages_out=$PACKAGES_OUT" >> $GITHUB_OUTPUT
          echo "openwrt_version=$OpenWRT_VERSION" >> $GITHUB_OUTPUT
          echo "kernel_version=$KERNEL_VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

          echo "Build variables set:"
          echo "PACKAGES_DIR_NAME: $PACKAGES_DIR_NAME"
          echo "TARGET_PKG_DIR: $TARGET_PKG_DIR"
          echo "PACKAGES_OUT: $PACKAGES_OUT"

      - name: Patch feeds.mk for custom package repository
        run: |
          cd openwrt
          # Update APK core package path
          sed -i "s|echo '%U/\$(DATE)_\$(VERSION_CODE)_\$(BRANCH)/targets/%S/packages/packages.adb';|echo '%U/${{ steps.variables.outputs.packages_out }}/packages.adb';|" include/feeds.mk
          echo "feeds.mk patched successfully"

      - name: Upload setup context
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-setup-context
          path: |
            openwrt/
            ${{ env.CONFIG_FILE }}
          retention-days: 1

  # --- JOB 2: Build Firmware ---
  build:
    needs: setup
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Download setup context
        uses: actions/download-artifact@v4
        with:
          name: openwrt-setup-context
          path: ${{ github.workspace }}

      - name: Cache OpenWRT download directory
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ${{ runner.os }}-openwrt-dl-${{ hashFiles('**/feeds.conf.default', '**/package/**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-

      - name: Cache OpenWRT build tree (ccache)
        uses: actions/cache@v4
        with:
          path: openwrt/build_dir/**/*.o
          key: ${{ runner.os }}-openwrt-ccache-${{ needs.setup.outputs.build_date }}-${{ needs.setup.outputs.version_code }}
          restore-keys: |
            ${{ runner.os }}-openwrt-ccache-

      - name: Download Sources
        run: |
          cd openwrt
          make download -j$(nproc) || { echo "Download failed"; exit 1; }
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Build Firmware
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) CCACHE=1 || make -j1 V=s CCACHE=1

      - name: Prepare build artifacts
        id: prepare-artifacts
        run: |
          BUILD_DIR=$(ls -d openwrt/bin/$(date +"%Y-%m-%d")_*)
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV
          
          # Extract version information
          cp $BUILD_DIR/targets/mediatek/filogic/version.buildinfo $GITHUB_WORKSPACE/version.buildinfo
          BUILDINFO=$(cat $GITHUB_WORKSPACE/version.buildinfo)
          
          NOW=$(date +%F-%H%M)
          RelTag="${NOW}_OpenWRT-${{ needs.setup.outputs.openwrt_version }}_Kernel-${{ needs.setup.outputs.kernel_version }}_${{ env.OpenWRTDevice }}"
          
          echo "BUILDINFO=$BUILDINFO" >> $GITHUB_ENV
          echo "NOW=$NOW" >> $GITHUB_ENV
          echo "RelTag=$RelTag" >> $GITHUB_ENV
          echo "firmware_path=$BUILD_DIR/targets/mediatek/filogic" >> $GITHUB_ENV

          echo "Build artifacts prepared:"
          echo "BUILDINFO: $BUILDINFO"
          echo "RelTag: $RelTag"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware-${{ env.OpenWRTDevice }}-${{ needs.setup.outputs.openwrt_version }}-k${{ needs.setup.outputs.kernel_version }}-${{ env.NOW }}
          path: |
            ${{ env.firmware_path }}/*.bin
            ${{ env.firmware_path }}/*.buildinfo
            ${{ env.firmware_path }}/*.manifest
            ${{ env.firmware_path }}/sha256sums
          retention-days: 30

      - name: Upload build context for deployment
        uses: actions/upload-artifact@v4
        with:
          name: build-context
          path: |
            openwrt/bin/
            version.buildinfo
          retention-days: 1

  # --- JOB 3: Package Deployment ---
  deploy-packages:
    needs: [setup, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    if: always() && needs.build.result == 'success'

    steps:
      - name: Download setup context
        uses: actions/download-artifact@v4
        with:
          name: openwrt-setup-context
          path: ${{ github.workspace }}

      - name: Download build context
        uses: actions/download-artifact@v4
        with:
          name: build-context
          path: ${{ github.workspace }}

      - name: Extract packages and prepare deployment
        id: extract-packages
        run: |
          BUILD_DIR=$(ls -d openwrt/bin/$(date +"%Y-%m-%d")_*)
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV
          
          cd $BUILD_DIR/targets/mediatek/filogic

          if [ -d "packages" ]; then
            echo "Found packages directory, processing..."
            PACKAGE_COUNT=$(find packages -name "*.apk" | wc -l)
            echo "PACKAGE_COUNT=$PACKAGE_COUNT" >> $GITHUB_ENV
            echo "packages_created=true" >> $GITHUB_ENV
          else
            echo "No packages directory found"
            echo "packages_created=false" >> $GITHUB_ENV
            exit 0
          fi

      - name: Deploy packages to repository
        if: env.packages_created == 'true'
        run: |
          BUILD_DIR=$(ls -d openwrt/bin/$(date +"%Y-%m-%d")_*)
          cd $GITHUB_WORKSPACE

          # Copy packages to output directory
          mkdir -p "${{ needs.setup.outputs.packages_out }}"
          cp -v $BUILD_DIR/targets/*/*/packages/* "${{ needs.setup.outputs.packages_out }}" || true
          ln -sfv "${{ needs.setup.outputs.packages_out }}" packages-output-openwrt-snapshot-pesa1234 || true

          # Create README with version info
          cat > "${{ needs.setup.outputs.packages_dir_name }}/README.md" << EOF
# OpenWRT Packages

**Generated on:** ${{ needs.setup.outputs.build_date }}
**Device:** ${{ env.OpenWRTDevice }}
**OpenWRT Version:** ${{ needs.setup.outputs.openwrt_version }}
**Kernel Version:** ${{ needs.setup.outputs.kernel_version }}
**Source Branch:** ${{ env.REPO_BRANCH }}
**Deploy Path:** ${{ needs.setup.outputs.packages_dir_name }}

## Package Repository Configuration

Add this to your OpenWRT device's /etc/opkg/distfeeds.conf:

\`\`\`
src/gz openwrt_core https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/${{ needs.setup.outputs.packages_out }}
\`\`\`

Replace %S with your target (e.g., mediatek/filogic)

## Package List
EOF

          # Add package list to README
          find "${{ needs.setup.outputs.packages_dir_name }}" -name "*.apk" -type f | sort | while read -r pkg; do
            PKG_NAME=$(basename "$pkg")
            PKG_SIZE=$(du -h "$pkg" | cut -f1)
            echo "- $PKG_NAME ($PKG_SIZE)" >> "${{ needs.setup.outputs.packages_dir_name }}/README.md"
          done

          git config --global user.name 'OpenWRT Build Bot'
          git config --global user.email 'actions@github.com'

          git pull origin ${{ github.ref }} --rebase --autostash

          git add "${{ needs.setup.outputs.packages_dir_name }}/"
          git add packages-output-openwrt-snapshot-pesa1234

          if ! git diff --staged --quiet; then
            git commit -m "Update packages ($PACKAGE_COUNT .apk files) - OpenWRT ${{ needs.setup.outputs.openwrt_version }} / Kernel ${{ needs.setup.outputs.kernel_version }}"
            git push origin ${{ github.ref }}
            echo "Successfully deployed $PACKAGE_COUNT packages"
          else
            echo "No changes detected in packages"
          fi

      - name: Create packages archive
        if: env.packages_created == 'true'
        run: |
          BUILD_DIR=$(ls -d openwrt/bin/$(date +"%Y-%m-%d")_*)
          cd $BUILD_DIR/targets/mediatek/filogic
          
          PACKAGES_ARCHIVE="openwrt-packages-${{ needs.setup.outputs.build_date }}-v${{ needs.setup.outputs.openwrt_version }}-k${{ needs.setup.outputs.kernel_version }}.tar.gz"
          tar -czf "$PACKAGES_ARCHIVE" packages/
          echo "PACKAGES_ARCHIVE=$PACKAGES_ARCHIVE" >> $GITHUB_ENV
          echo "Created archive: $PACKAGES_ARCHIVE"

      - name: Upload packages archive
        if: env.packages_created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWRT_packages-${{ env.OpenWRTDevice }}-${{ needs.setup.outputs.openwrt_version }}-k${{ needs.setup.outputs.kernel_version }}-${{ needs.build.outputs.NOW }}
          path: ${{ env.BUILD_DIR }}/targets/mediatek/filogic/${{ env.PACKAGES_ARCHIVE }}
          retention-days: 30

  # --- JOB 4: Release Creation ---
  create-release:
    needs: [build, deploy-packages]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    if: always() && needs.build.result == 'success'

    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openwrt-firmware-*
          path: firmware-artifacts

      - name: Download packages archive
        uses: actions/download-artifact@v4
        with:
          pattern: OpenWRT_packages-*
          path: packages-artifacts

      - name: List artifacts for release
        run: |
          echo "Firmware artifacts:"
          find firmware-artifacts -type f -name "*.bin" -o -name "*.buildinfo" -o -name "*.manifest" -o -name "sha256sums" | sort
          echo "Packages artifacts:"
          find packages-artifacts -type f -name "*.tar.gz" | sort

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.BUILDINFO }}
          name: "${{ needs.build.outputs.RelTag }}"
          body: |
            OpenWRT SNAPSHOT Build for ${{ env.OpenWRTDevice }}
            
            **Build Details:**
            - OpenWRT Version: ${{ needs.setup.outputs.openwrt_version }}
            - Kernel Version: ${{ needs.setup.outputs.kernel_version }}
            - Build Date: ${{ needs.setup.outputs.build_date }}
            - Source Branch: ${{ env.REPO_BRANCH }}
            - Commit: ${{ needs.setup.outputs.version_code }}
            
            **Included Artifacts:**
            - Firmware images (.bin)
            - Build information (.buildinfo, .manifest)
            - Checksums (sha256sums)
            - Packages archive (.tar.gz)
          files: |
            firmware-artifacts/**/*
            packages-artifacts/**/*
          draft: false
          prerelease: false

  # --- JOB 5: Cleanup ---
  cleanup:
    needs: [setup, build, deploy-packages, create-release]
    runs-on: ubuntu-22.04
    if: always()

    steps:
      - name: Delete temporary artifacts
        run: |
          echo "Cleaning up temporary build artifacts..."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Workflow status
        run: |
          echo "Workflow completed with status:"
          echo "Setup: ${{ needs.setup.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Deploy: ${{ needs.deploy-packages.result }}"
          echo "Release: ${{ needs.create-release.result }}"
