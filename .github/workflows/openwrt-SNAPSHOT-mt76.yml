name: OpenWRT SNAPSHOT Firmware mt76 driver (pesa1234)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      branch_override:
        description: 'Override the default branch (e.g., next-r4.7.2)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      repo_url: https://github.com/pesa1234/openwrt.git
      repo_branch: ${{ inputs.branch_override || 'next-r4.7.2.rss.mtk' }}
      config_file: config.openwrt-snapshot-pesa1234
      device_name: Flint2_GL-MT6000
      firmware_name: openwrt-snapshot-pesa1234
      source_dir: openwrt
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
