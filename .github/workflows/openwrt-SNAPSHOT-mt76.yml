name: OpenWRT SNAPSHOT Firmware mt76 driver (pesa1234)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      branch_override:
        description: 'Override the default branch (e.g., next-r4.7.4)'
        required: false
        type: string
  schedule:
    - cron: '0 5 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/pesa1234/openwrt.git
  REPO_BRANCH: ${{ inputs.branch_override || 'next-r4.7.4.rss.mtk' }}
  DEVICE_NAME: Flint2_GL-MT6000
  FIRMWARE_NAME: openwrt-snapshot-pesa1234
  CONFIG_FILE: config.openwrt-snapshot-pesa1234

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      repo_url: ${{ env.REPO_URL }}
      repo_branch: ${{ inputs.branch_override || 'next-r4.7.4.rss.mtk' }}
      config_file: ${{ env.CONFIG_FILE }}
      source_dir: openwrt

  prepare:
    needs: build
    uses: ./.github/workflows/reusable-prepare-packages.yml
    with:
      date: ${{ needs.build.outputs.date }}
      version_code: ${{ needs.build.outputs.version_code }}
      openwrt_version: ${{ needs.build.outputs.openwrt_version }}
      kernel_version: ${{ needs.build.outputs.kernel_version }}
      target_pkg_dir: ${{ needs.build.outputs.target_pkg_dir }}
      firmware_name: ${{ env.FIRMWARE_NAME }}
      device_name: ${{ env.DEVICE_NAME }}
      source_branch: ${{ inputs.branch_override || 'next-r4.7.4.rss.mtk' }}

  deploy:
    needs: [build, prepare]
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      date: ${{ needs.build.outputs.date }}
      firmware_name: ${{ env.FIRMWARE_NAME }}
      device_name: ${{ env.DEVICE_NAME }}
      openwrt_version: ${{ needs.build.outputs.openwrt_version }}
      kernel_version: ${{ needs.build.outputs.kernel_version }}
      buildinfo: ${{ needs.build.outputs.buildinfo }}
      packages_dir_name: ${{ needs.prepare.outputs.packages_dir_name }}
      package_count: ${{ needs.prepare.outputs.package_count }}
      packages_archive: ${{ needs.prepare.outputs.packages_archive }}
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}