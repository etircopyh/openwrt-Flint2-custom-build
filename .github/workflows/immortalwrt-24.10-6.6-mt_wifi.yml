name: ImmortalWRT 24.10 Linux 6.6 Firmware mt_wifi driver (padavanonly)

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      repo_url: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
      repo_branch: openwrt-24.10-6.6
      config_file: config.immortalwrt-2410-6.6-padavanonly
      source_dir: immortalwrt-mt798x-6.6
      patch_feeds_mk: true
      feeds_mk_type: immortalwrt-opkg
      opkg_link: https://downloads.immortalwrt.org/releases/24.10-SNAPSHOT
      apk_link: https://downloads.openwrt.org/snapshots/packages

  prepare:
    needs: build
    uses: ./.github/workflows/reusable-prepare-packages.yml
    with:
      date: ${{ needs.build.outputs.date }}
      version_code: ${{ needs.build.outputs.version_code }}
      openwrt_version: ${{ needs.build.outputs.openwrt_version }}
      kernel_version: ${{ needs.build.outputs.kernel_version }}
      target_pkg_dir: ${{ needs.build.outputs.target_pkg_dir }}
      firmware_name: immortalwrt-2410-6.6-padavanonly
      device_name: Flint2_GL-MT6000
      source_branch: openwrt-24.10-6.6

  deploy:
    needs: [build, prepare]
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      date: ${{ needs.build.outputs.date }}
      firmware_name: immortalwrt-2410-6.6-padavanonly
      device_name: Flint2_GL-MT6000
      openwrt_version: ${{ needs.build.outputs.openwrt_version }}
      kernel_version: ${{ needs.build.outputs.kernel_version }}
      buildinfo: ${{ needs.build.outputs.buildinfo }}
      packages_dir_name: ${{ needs.prepare.outputs.packages_dir_name }}
      package_count: ${{ needs.prepare.outputs.package_count }}
      packages_archive: ${{ needs.prepare.outputs.packages_archive }}
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
