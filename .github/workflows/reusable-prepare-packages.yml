name: Reusable Prepare Packages

on:
  workflow_call:
    inputs:
      date:
        required: true
        type: string
      version_code:
        required: true
        type: string
      openwrt_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      target_pkg_dir:
        required: true
        type: string
      firmware_name:
        required: true
        type: string
      device_name:
        required: true
        type: string
      source_branch:
        required: false
        type: string
        default: ""

    outputs:
      package_count:
        description: "Number of packages found"
        value: ${{ jobs.prepare.outputs.package_count }}
      packages_dir_name:
        description: "Output directory name for packages"
        value: ${{ jobs.prepare.outputs.packages_dir_name }}
      packages_archive:
        description: "Archive filename"
        value: ${{ jobs.prepare.outputs.packages_archive }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write

    outputs:
      package_count: ${{ steps.packages.outputs.package_count }}
      packages_dir_name: ${{ steps.packages.outputs.packages_dir_name }}
      packages_archive: ${{ steps.packages.outputs.packages_archive }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: openwrt-build-${{ inputs.date }}
          path: bin

      - name: Resolve build directory
        id: builddir
        run: |
          TARGET_DIR="targets/${{ inputs.target_pkg_dir }}"
          # Prefer the dated build tree used by the custom builds; fall back
          # to the standard OpenWrt bin/targets layout.
          BUILD_DIR=""
          for d in bin/20*_*; do
            if [ -d "$d/$TARGET_DIR" ]; then
              BUILD_DIR="$d"
              break
            fi
          done
          if [ -z "$BUILD_DIR" ] && [ -d "bin/$TARGET_DIR" ]; then
            BUILD_DIR=bin
          fi
          if [ -z "$BUILD_DIR" ]; then
            echo "No build directory containing $TARGET_DIR found under bin" >&2
            find bin -maxdepth 3 -type d | sort | sed -n '1,50p' >&2
            exit 1
          fi
          echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          echo "Resolved build directory: $BUILD_DIR"

      - name: Prepare packages
        id: packages
        run: |
          BUILD_DIR="${{ steps.builddir.outputs.dir }}"
          echo "Build directory: $BUILD_DIR"

          PACKAGES_DIR_NAME="${{ inputs.date }}_${{ inputs.firmware_name }}_${{ inputs.version_code }}_kernel-${{ inputs.kernel_version }}"
          PACKAGES_OUT="${PACKAGES_DIR_NAME}/targets/${{ inputs.target_pkg_dir }}/packages"
          rm -rf "$PACKAGES_DIR_NAME"
          mkdir -p "$PACKAGES_OUT"

          TARGETS_PKG_SRC="${BUILD_DIR}/targets/${{ inputs.target_pkg_dir }}/packages"
          if [ ! -d "$TARGETS_PKG_SRC" ]; then
            echo "Package directory not found: $TARGETS_PKG_SRC" >&2
            echo "package_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Publish the complete target package directory, including the
          # Packages / packages.adb index and signature files. Do not merge
          # feed directories here: flattening them would leave the index
          # describing none of the copied files.
          cp -a "$TARGETS_PKG_SRC"/. "$PACKAGES_OUT"/

          PACKAGE_COUNT=$(find "$PACKAGES_OUT" -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' \) | wc -l)
          echo "Packages in $PACKAGES_OUT: $PACKAGE_COUNT"

          if [ "$PACKAGE_COUNT" -eq 0 ]; then
            echo "package_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Create README
          REPO_NAME="${{ github.repository }}"
          BRANCH_NAME="${{ github.ref_name }}"
          FEED_URL="https://raw.githubusercontent.com/${REPO_NAME}/${BRANCH_NAME}/${PACKAGES_OUT}"
          {
            echo "# ${{ inputs.firmware_name }} Packages"
            echo ""
            echo "Generated on: ${{ inputs.date }}"
            echo "Device: ${{ inputs.device_name }}"
            echo "OpenWRT Version: ${{ inputs.openwrt_version }}"
            echo "Kernel Version: ${{ inputs.kernel_version }}"
            if [ -n "${{ inputs.source_branch }}" ]; then
              echo "Source Branch: ${{ inputs.source_branch }}"
            fi
            echo "Deploy Path: ${PACKAGES_DIR_NAME}"
            echo ""
            echo "## Package Repository Configuration"
            echo ""
            if find "$PACKAGES_OUT" -maxdepth 1 -type f -name '*.apk' | grep -q .; then
              echo "Add this line to your OpenWRT device's /etc/apk/repositories.d/customfeeds.list:"
              echo ""
              echo "${FEED_URL}/packages.adb"
            elif find "$PACKAGES_OUT" -maxdepth 1 -type f -name '*.ipk' | grep -q .; then
              echo "Add this to your OpenWRT device's /etc/opkg/distfeeds.conf:"
              echo ""
              echo "src/gz custom_core ${FEED_URL}"
            fi
            echo ""
            echo "## Package List"
          } > "${PACKAGES_DIR_NAME}/README.md"

          find "$PACKAGES_OUT" -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' \) | sort | while read -r pkg; do
            PKG_NAME=$(basename "$pkg")
            PKG_SIZE=$(du -h "$pkg" | cut -f1)
            echo "- ${PKG_NAME} (${PKG_SIZE})" >> "${PACKAGES_DIR_NAME}/README.md"
          done

          # Create symlink to the stable feed directory
          SYMLINK_NAME="packages-output-${{ inputs.firmware_name }}"
          ln -sf "$PACKAGES_DIR_NAME" "$SYMLINK_NAME"

          # Create archive
          PACKAGES_ARCHIVE="packages-${{ inputs.firmware_name }}-${{ inputs.date }}.tar.gz"
          tar -czf "$PACKAGES_ARCHIVE" -C "$PACKAGES_DIR_NAME" .

          echo "package_count=$PACKAGE_COUNT" >> "$GITHUB_OUTPUT"
          echo "packages_dir_name=$PACKAGES_DIR_NAME" >> "$GITHUB_OUTPUT"
          echo "packages_archive=$PACKAGES_ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload packages archive
        if: steps.packages.outputs.package_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: packages-archive-${{ inputs.date }}
          path: ${{ steps.packages.outputs.packages_archive }}
          retention-days: 7
          compression-level: 9

      - name: Prepare firmware artifact
        run: |
          BUILD_DIR="${{ steps.builddir.outputs.dir }}"
          FIRMWARE_DIR="${BUILD_DIR}/targets/${{ inputs.target_pkg_dir }}"
          cd "$FIRMWARE_DIR"
          rm -rf packages
          mkdir -p "$GITHUB_WORKSPACE/firmware-upload"
          cp -a . "$GITHUB_WORKSPACE/firmware-upload/"
          echo "FIRMWARE_DIR=$GITHUB_WORKSPACE/firmware-upload" >> $GITHUB_ENV

      - name: Upload firmware for release
        uses: actions/upload-artifact@v4
        with:
          name: firmware-release-${{ inputs.date }}
          path: firmware-upload/
          retention-days: 7
          compression-level: 6
