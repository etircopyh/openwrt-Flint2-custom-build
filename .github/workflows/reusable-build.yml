name: Reusable OpenWrt Build Workflow

on:
  workflow_call:
    inputs:
      repo_url:
        required: true
        type: string
      repo_branch:
        required: true
        type: string
      config_file:
        required: true
        type: string
      device_name:
        required: true
        type: string
      firmware_name:
        required: true
        type: string
      source_dir:
        required: false
        type: string
        default: 'openwrt'
      patch_file:
        required: false
        type: string
        default: ''
      patch_target:
        required: false
        type: string
        default: ''
      kernel_version:
        required: false
        type: string
        default: ''
    secrets:
      github_token:
        required: true

env:
  TZ: Europe/Kyiv

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Free up disk space
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune --all --force
          sudo -E apt-get -qq update
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          df -h

      - name: Cache build downloads
        uses: actions/cache@v4
        with:
          path: /workdir/${{ inputs.source_dir }}/dl
          key: ${{ runner.os }}-${{ inputs.firmware_name }}-dl-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.firmware_name }}-dl-

      - name: Clone source
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone --branch ${{ inputs.repo_branch }} ${{ inputs.repo_url }} ${{ inputs.source_dir }}
          ln -sf /workdir/${{ inputs.source_dir }} $GITHUB_WORKSPACE/${{ inputs.source_dir }}

      - name: Apply patch if specified
        if: inputs.patch_file != '' && inputs.patch_target != ''
        run: |
          if [ -f "${{ inputs.patch_file }}" ]; then
            cp "${{ inputs.patch_file }}" "${{ inputs.source_dir }}/${{ inputs.patch_target }}"
            echo "Applied patch"
          fi

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-distutils \
            rsync swig unzip zlib1g-dev file wget \
            llvm libpcre3 libpcre3-dev zstd mold

      - name: Display config
        run: cat ${{ inputs.config_file }}

      - name: Update and install feeds
        run: |
          cd ${{ inputs.source_dir }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure firmware
        run: |
          cp ${{ inputs.config_file }} ${{ inputs.source_dir }}/.config
          cd ${{ inputs.source_dir }}
          make defconfig

      - name: Set build variables
        run: |
          cd ${{ inputs.source_dir }}
          echo "DATE=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV
          echo "VERSION_CODE=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Create package directories
        run: |
          cd ${{ inputs.source_dir }}
          FIRMWARE_NAME="${{ inputs.firmware_name }}"
          KERNEL_VER="${{ inputs.kernel_version }}"
          if [ -z "$KERNEL_VER" ]; then
            KERNEL_VER=$(grep -m1 "KERNEL_PATCHVER:" target/linux/mediatek/Makefile 2>/dev/null | cut -d= -f2 | tr -d ' ' | cut -d. -f1-2 || echo "6.6")
          fi
          echo "KERNEL_VERSION=$KERNEL_VER" >> $GITHUB_ENV
          echo "FIRMWARE_VERSION=$FIRMWARE_NAME" >> $GITHUB_ENV

          PACKAGES_DIR_NAME="${DATE}_${FIRMWARE_NAME}_${VERSION_CODE}"
          TARGET_BOARD=$(grep '^CONFIG_TARGET_BOARD=' .config | cut -d= -f2 | tr -d '"')
          TARGET_SUBTARGET=$(grep '^CONFIG_TARGET_SUBTARGET=' .config | cut -d= -f2 | tr -d '"')
          TARGET_PKG_DIR="${TARGET_BOARD}/${TARGET_SUBTARGET}"
          PACKAGES_OUT="${PACKAGES_DIR_NAME}/targets/${TARGET_PKG_DIR}/packages"
          mkdir -p "${PACKAGES_OUT}"

          echo "PACKAGES_DIR_NAME=$PACKAGES_DIR_NAME" >> $GITHUB_ENV
          echo "TARGET_PKG_DIR=$TARGET_PKG_DIR" >> $GITHUB_ENV
          echo "PACKAGES_OUT=$PACKAGES_OUT" >> $GITHUB_ENV

      - name: Download sources
        run: |
          cd ${{ inputs.source_dir }}
          make download -j$(nproc) || { echo "Download failed"; exit 1; }
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        run: |
          cd ${{ inputs.source_dir }}
          make -j$(nproc) || make -j1 V=s

      - name: Deploy packages
        id: deploy
        run: |
          BUILD_DIR=$(find ${{ inputs.source_dir }}/bin -maxdepth 1 -type d -name "*_*" 2>/dev/null | head -1)
          if [ -z "$BUILD_DIR" ]; then
            echo "No build directory found"
            echo "PACKAGES_CREATED=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          TARGET_DIR="${BUILD_DIR}/targets/${TARGET_PKG_DIR}"
          if [ ! -d "${TARGET_DIR}/packages" ]; then
            echo "No packages directory found at ${TARGET_DIR}/packages"
            echo "PACKAGES_CREATED=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          PACKAGE_COUNT=$(find "${TARGET_DIR}/packages" -type f 2>/dev/null | wc -l)
          echo "Found $PACKAGE_COUNT packages"

          if [ "$PACKAGE_COUNT" -eq 0 ]; then
            echo "No packages to deploy"
            echo "PACKAGES_CREATED=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          cp -r "${TARGET_DIR}/packages/"* "$PACKAGES_OUT/" || true

          # Create README
          {
            echo "# ${{ inputs.firmware_name }} Packages"
            echo ""
            echo "Generated on: ${DATE}"
            echo "Device: ${{ inputs.device_name }}"
            echo "Firmware: ${FIRMWARE_VERSION}"
            echo "Kernel: ${KERNEL_VERSION}"
            echo ""
            echo "## Package List"
          } > "${PACKAGES_DIR_NAME}/README.md"

          find "${PACKAGES_OUT}" -type f \( -name "*.ipk" -o -name "*.apk" \) 2>/dev/null | sort | while read -r pkg; do
            PKG_NAME=$(basename "$pkg")
            PKG_SIZE=$(du -h "$pkg" 2>/dev/null | cut -f1)
            echo "- ${PKG_NAME} (${PKG_SIZE})" >> "${PACKAGES_DIR_NAME}/README.md"
          done

          git config --global user.name 'GitHub Build Bot'
          git config --global user.email 'actions@github.com'

          git pull origin ${{ github.ref_name }} --rebase --autostash || true

          SYMLINK_NAME="packages-output-${{ inputs.firmware_name }}"
          rm -f "$SYMLINK_NAME"
          ln -sf "$PACKAGES_OUT" "$SYMLINK_NAME"

          git add "$PACKAGES_DIR_NAME/"
          git add "$SYMLINK_NAME"

          if ! git diff --staged --quiet; then
            git commit -m "Update packages ($PACKAGE_COUNT files) - ${{ inputs.device_name }}"
            git push origin ${{ github.ref_name }}
            echo "PACKAGES_CREATED=true" >> $GITHUB_OUTPUT
            echo "PACKAGE_COUNT=$PACKAGE_COUNT" >> $GITHUB_OUTPUT
          else
            echo "No changes to commit"
            echo "PACKAGES_CREATED=false" >> $GITHUB_OUTPUT
          fi

      - name: Create archive
        if: steps.deploy.outputs.PACKAGES_CREATED == 'true'
        run: |
          BUILD_DIR=$(find ${{ inputs.source_dir }}/bin -maxdepth 1 -type d -name "*_*" 2>/dev/null | head -1)
          if [ -n "$BUILD_DIR" ]; then
            TARGET_DIR="${BUILD_DIR}/targets/${TARGET_PKG_DIR}"
            if [ -d "${TARGET_DIR}/packages" ]; then
              cd "$TARGET_DIR"
              ARCHIVE_NAME="packages-${{ inputs.firmware_name }}-${DATE}.tar.gz"
              tar -czf "${GITHUB_WORKSPACE}/${ARCHIVE_NAME}" packages/
              echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV
              echo "ARCHIVE_PATH=${GITHUB_WORKSPACE}/${ARCHIVE_NAME}" >> $GITHUB_ENV
            fi
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ inputs.firmware_name }}-${{ env.DATE }}
          path: ${{ inputs.source_dir }}/bin/targets/*/*
          retention-days: 30

      - name: Upload packages archive
        if: env.ARCHIVE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ inputs.firmware_name }}-${{ env.DATE }}
          path: ${{ env.ARCHIVE_PATH }}
          retention-days: 30

      - name: Create release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.github_token }}
          prerelease: false
          title: "${{ inputs.device_name }}-${{ env.DATE }}"
          automatic_release_tag: "${{ inputs.firmware_name }}-${{ env.DATE }}"
          files: |
            ${{ inputs.source_dir }}/bin/targets/*/*/*.bin
            ${{ inputs.source_dir }}/bin/targets/*/*/*.buildinfo
            ${{ inputs.source_dir }}/bin/targets/*/*/*.manifest
            ${{ inputs.source_dir }}/bin/targets/*/*/sha256sums
            ${{ env.ARCHIVE_PATH }}
