name: Reusable Build

on:
  workflow_call:
    inputs:
      repo_url:
        required: true
        type: string
      repo_branch:
        required: true
        type: string
      config_file:
        required: true
        type: string
      source_dir:
        required: false
        type: string
        default: 'openwrt'
      patch_file:
        required: false
        type: string
        default: ''
      patch_target:
        required: false
        type: string
        default: ''
      patch_feeds_mk:
        description: 'Whether to patch include/feeds.mk for custom package repository'
        required: false
        type: boolean
        default: true
      feeds_mk_type:
        description: 'Type of feeds.mk patch: "openwrt-apk" or "immortalwrt-opkg"'
        required: false
        type: string
        default: 'openwrt-apk'
      opkg_link:
        description: 'Base URL for OPKG feeds (used when feeds_mk_type=immortalwrt-opkg)'
        required: false
        type: string
        default: ''
      apk_link:
        description: 'Base URL for APK feeds (used when feeds_mk_type=immortalwrt-opkg)'
        required: false
        type: string
        default: ''

    outputs:
      date:
        description: 'Build date (YYYYMMDD_HHMMSS)'
        value: ${{ jobs.build.outputs.date }}
      version_code:
        description: 'Git short SHA of source repo'
        value: ${{ jobs.build.outputs.version_code }}
      openwrt_version:
        description: 'OpenWRT version string'
        value: ${{ jobs.build.outputs.openwrt_version }}
      kernel_version:
        description: 'Kernel version (e.g., 6.6)'
        value: ${{ jobs.build.outputs.kernel_version }}
      buildinfo:
        description: 'Build info string'
        value: ${{ jobs.build.outputs.buildinfo }}
      target_pkg_dir:
        description: 'Target package directory (e.g., mediatek/filogic)'
        value: ${{ jobs.build.outputs.target_pkg_dir }}

env:
  TZ: Europe/Kyiv
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write

    outputs:
      date: ${{ steps.version.outputs.date }}
      version_code: ${{ steps.version.outputs.version_code }}
      openwrt_version: ${{ steps.version.outputs.openwrt_version }}
      kernel_version: ${{ steps.version.outputs.kernel_version }}
      buildinfo: ${{ steps.version.outputs.buildinfo }}
      target_pkg_dir: ${{ steps.version.outputs.target_pkg_dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Free up disk space
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune --all --force
          sudo -E apt-get -qq update
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          df -h

      - name: Cache build downloads
        uses: actions/cache@v4
        with:
          path: /workdir/${{ inputs.source_dir }}/dl
          key: ${{ runner.os }}-${{ inputs.repo_branch }}-dl-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.repo_branch }}-dl-

      - name: Clone source
        working-directory: /workdir
        run: |
          df -hT $PWD
          # Clean up any existing directory from previous runs
          rm -rf ${{ inputs.source_dir }}
          git clone --branch ${{ inputs.repo_branch }} ${{ inputs.repo_url }} ${{ inputs.source_dir }}
          ln -sf /workdir/${{ inputs.source_dir }} $GITHUB_WORKSPACE/${{ inputs.source_dir }}

      - name: Apply patch if specified
        if: inputs.patch_file != '' && inputs.patch_target != ''
        run: |
          if [ -f "${{ inputs.patch_file }}" ]; then
            cp "${{ inputs.patch_file }}" "${{ inputs.source_dir }}/${{ inputs.patch_target }}"
            echo "Applied patch: ${{ inputs.patch_file }}"
          fi

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-distutils \
            rsync swig unzip zlib1g-dev file wget \
            llvm libpcre3 libpcre3-dev zstd mold

      - name: Display config
        run: cat ${{ inputs.config_file }}

      - name: Update and install feeds
        run: |
          cd ${{ inputs.source_dir }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch feeds.mk for custom package repository
        if: inputs.patch_feeds_mk == true
        run: |
          cd ${{ inputs.source_dir }}
          
          if [ "${{ inputs.feeds_mk_type }}" = "immortalwrt-opkg" ]; then
            # ImmortalWRT style patching with OPKG and APK links
            OPKG_LINK="${{ inputs.opkg_link }}"
            APK_LINK="${{ inputs.apk_link }}"
            
            # Add variables after -include line
            sed -i '/^-include $(TMP_DIR)\/.packageauxvars$/a\\nIWRT_OPKG_LINK:='"$OPKG_LINK"'\nOWRT_APK_LINK:='"$APK_LINK"'' include/feeds.mk
            
            # Update OPKG core package path
            sed -i "s|echo 'src/gz %d_core %U/targets/%S/packages';|echo 'src/gz %d_core %U/\${PACKAGES_OUT}';|" include/feeds.mk
            
            # Update OPKG base package path
            sed -i "s|echo 'src/gz %d_base %U/packages/%A/base';|echo 'src/gz %d_base \${IWRT_OPKG_LINK}/packages/%A/base';|" include/feeds.mk
            
            # Update OPKG feed package paths
            sed -i "s|echo '\$(if \$(filter m,\$(CONFIG_FEED_\$(feed))),# )src/gz %d_\$(feed) %U/packages/%A/\$(feed)';|echo '\$(if \$(filter m,\$(CONFIG_FEED_\$(feed))),# )src/gz %d_\$(feed) \${IWRT_OPKG_LINK}/packages/%A/\$(feed)';|" include/feeds.mk
            
            # Update APK core package path
            sed -i "s|echo '%U/targets/%S/packages/packages.adb';|echo '%U/\${PACKAGES_OUT}/packages.adb';|" include/feeds.mk
            
            # Update APK base package path
            sed -i "s|echo '%U/packages/%A/base/packages.adb';|echo '\${OWRT_APK_LINK}/%A/base/packages.adb';|" include/feeds.mk
            
            # Update APK feed package paths
            sed -i "s|echo '\$(if \$(filter m,\$(CONFIG_FEED_\$(feed))),# )%U/packages/%A/\$(feed)/packages.adb';|echo '\$(if \$(filter m,\$(CONFIG_FEED_\$(feed))),# )\${OWRT_APK_LINK}/%A/\$(feed)/packages.adb';|" include/feeds.mk
            
            echo "feeds.mk patched for ImmortalWRT (OPKG: $OPKG_LINK, APK: $APK_LINK)"
          else
            # OpenWRT style patching (APK only)
            # Update APK core package path
            sed -i "s|echo '%U/\$(DATE)_\$(VERSION_CODE)_\$(BRANCH)/targets/%S/packages/packages.adb';|echo '%U/\${PACKAGES_OUT}/packages.adb';|" include/feeds.mk
            echo "feeds.mk patched for OpenWRT (APK)"
          fi

      - name: Configure firmware
        run: |
          cp ${{ inputs.config_file }} ${{ inputs.source_dir }}/.config
          cd ${{ inputs.source_dir }}
          make defconfig

      - name: Download sources
        run: |
          cd ${{ inputs.source_dir }}
          make download -j$(nproc) || { echo "Download failed"; exit 1; }
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        run: |
          cd ${{ inputs.source_dir }}
          make -j$(nproc) || make -j1 V=s

      - name: Extract version information
        id: version
        run: |
          cd ${{ inputs.source_dir }}

          # Date and version code
          DATE=$(date +%Y%m%d_%H%M%S)
          VERSION_CODE=$(git rev-parse --short HEAD)

          # OpenWRT version
          OPENWRT_VERSION="SNAPSHOT"
          if [ -f "include/version.mk" ]; then
            VERSION_FROM_FILE=$(grep -m1 "VERSION_NUMBER" include/version.mk 2>/dev/null | cut -d= -f2 | tr -d ' ' || echo "")
            if [ -n "$VERSION_FROM_FILE" ]; then
              OPENWRT_VERSION="$VERSION_FROM_FILE"
            fi
          fi

          # Kernel version
          KERNEL_VERSION=""
          if grep -q 'HAS_TESTING_KERNEL=y' .config 2>/dev/null; then
            KERNEL_VERSION=$(grep -m1 "KERNEL_TESTING_PATCHVER:" target/linux/*/Makefile 2>/dev/null | head -1 | cut -d= -f2 | tr -d ' ' | cut -d. -f1-2)
          fi
          if [ -z "$KERNEL_VERSION" ]; then
            KERNEL_VERSION=$(grep -m1 "KERNEL_PATCHVER:" target/linux/*/Makefile 2>/dev/null | head -1 | cut -d= -f2 | tr -d ' ' | cut -d. -f1-2)
          fi
          KERNEL_VERSION=${KERNEL_VERSION:-"6.6"}

          # Target info
          TARGET_BOARD=$(grep '^CONFIG_TARGET_BOARD=' .config | cut -d= -f2 | tr -d '"')
          TARGET_SUBTARGET=$(grep '^CONFIG_TARGET_SUBTARGET=' .config | cut -d= -f2 | tr -d '"')
          TARGET_PKG_DIR="${TARGET_BOARD}/${TARGET_SUBTARGET}"

          # Buildinfo
          BUILD_DIR=$(find bin -maxdepth 1 -type d -name "*_*" 2>/dev/null | head -1)
          BUILDINFO=""
          if [ -n "$BUILD_DIR" ]; then
            BUILDINFO=$(cat "$BUILD_DIR/targets/"*/*/version.buildinfo 2>/dev/null | head -1 || echo "")
          fi
          BUILDINFO=${BUILDINFO:-"${DATE}-${VERSION_CODE}"}

          # Sanitize
          OPENWRT_VERSION=$(echo "$OPENWRT_VERSION" | sed 's/[^a-zA-Z0-9.-]//g')
          KERNEL_VERSION=$(echo "$KERNEL_VERSION" | sed 's/[^0-9.]//g')

          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "openwrt_version=$OPENWRT_VERSION" >> $GITHUB_OUTPUT
          echo "kernel_version=$KERNEL_VERSION" >> $GITHUB_OUTPUT
          echo "buildinfo=$BUILDINFO" >> $GITHUB_OUTPUT
          echo "target_pkg_dir=$TARGET_PKG_DIR" >> $GITHUB_OUTPUT

          echo "=== Build Info ==="
          echo "Date: $DATE"
          echo "Version Code: $VERSION_CODE"
          echo "OpenWRT Version: $OPENWRT_VERSION"
          echo "Kernel Version: $KERNEL_VERSION"
          echo "BuildInfo: $BUILDINFO"
          echo "Target: $TARGET_PKG_DIR"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-build-${{ steps.version.outputs.date }}
          path: ${{ inputs.source_dir }}/bin/
          retention-days: 7