name: Reusable Build

on:
  workflow_call:
    inputs:
      repo_url:
        required: true
        type: string
      repo_branch:
        required: true
        type: string
      config_file:
        required: true
        type: string
      firmware_name:
        description: "Package feed name, e.g. openwrt-snapshot-pesa1234"
        required: true
        type: string
      source_dir:
        required: false
        type: string
        default: "openwrt"
      patch_file:
        description: "Patch file in the repository root"
        required: false
        type: string
        default: ""
      patch_target:
        description: "Path under the source tree to copy the patch into (file or directory)"
        required: false
        type: string
        default: ""
      patch_feeds_mk:
        description: "Whether to patch include/feeds.mk for custom package repository"
        required: false
        type: boolean
        default: true
      feeds_mk_type:
        description: 'Type of feeds.mk patch: "openwrt-apk" or "immortalwrt-opkg"'
        required: false
        type: string
        default: "openwrt-apk"
      opkg_link:
        description: "Base URL for OPKG feeds (used when feeds_mk_type=immortalwrt-opkg)"
        required: false
        type: string
        default: ""
      apk_link:
        description: "Base URL for APK feeds (used when feeds_mk_type=immortalwrt-opkg)"
        required: false
        type: string
        default: ""

    outputs:
      date:
        description: "Build date (YYYYMMDD_HHMMSS)"
        value: ${{ jobs.build.outputs.date }}
      version_code:
        description: "Git short SHA of source repo"
        value: ${{ jobs.build.outputs.version_code }}
      openwrt_version:
        description: "OpenWRT version string"
        value: ${{ jobs.build.outputs.openwrt_version }}
      kernel_version:
        description: "Kernel version (e.g., 6.6)"
        value: ${{ jobs.build.outputs.kernel_version }}
      buildinfo:
        description: "Build info string"
        value: ${{ jobs.build.outputs.buildinfo }}
      target_pkg_dir:
        description: "Target package directory (e.g., mediatek/filogic)"
        value: ${{ jobs.build.outputs.target_pkg_dir }}

env:
  TZ: Europe/Kyiv
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write

    outputs:
      date: ${{ steps.builddate.outputs.date }}
      version_code: ${{ steps.target.outputs.version_code }}
      openwrt_version: ${{ steps.version.outputs.openwrt_version }}
      kernel_version: ${{ steps.target.outputs.kernel_version }}
      buildinfo: ${{ steps.version.outputs.buildinfo }}
      target_pkg_dir: ${{ steps.target.outputs.target_pkg_dir }}

    steps:
      - name: Set build date
        id: builddate
        run: echo "date=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Free up disk space
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune --all --force
          sudo -E apt-get -qq update
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          df -h

      - name: Clone source
        working-directory: /workdir
        run: |
          df -hT $PWD
          # Clean up any existing directory from previous runs
          rm -rf ${{ inputs.source_dir }}
          git clone --branch ${{ inputs.repo_branch }} ${{ inputs.repo_url }} ${{ inputs.source_dir }}
          ln -sf /workdir/${{ inputs.source_dir }} $GITHUB_WORKSPACE/${{ inputs.source_dir }}

      - name: Cache build downloads
        uses: actions/cache@v4
        with:
          path: /workdir/${{ inputs.source_dir }}/dl
          key: ${{ runner.os }}-${{ inputs.repo_branch }}-dl-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.repo_branch }}-dl-

      - name: Apply patch if specified
        if: inputs.patch_file != '' && inputs.patch_target != ''
        run: |
          if [ ! -f "${{ inputs.patch_file }}" ]; then
            echo "Patch file not found: ${{ inputs.patch_file }}" >&2
            exit 1
          fi
          cp "${{ inputs.patch_file }}" "${{ inputs.source_dir }}/${{ inputs.patch_target }}"
          echo "Installed patch: ${{ inputs.patch_file }}"

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-distutils \
            rsync swig unzip zlib1g-dev file wget \
            llvm libpcre3 libpcre3-dev zstd mold

      - name: Display config
        run: cat ${{ inputs.config_file }}

      - name: Update and install feeds
        run: |
          cd ${{ inputs.source_dir }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure firmware
        run: |
          cp ${{ inputs.config_file }} ${{ inputs.source_dir }}/.config
          cd ${{ inputs.source_dir }}
          make defconfig

      - name: Resolve build metadata
        id: target
        run: |
          SOURCE_DIR="$GITHUB_WORKSPACE/${{ inputs.source_dir }}"
          CONFIG_FILE="$SOURCE_DIR/.config"

          TARGET_BOARD=$(grep '^CONFIG_TARGET_BOARD=' "$CONFIG_FILE" | cut -d= -f2 | tr -d '"')
          TARGET_SUBTARGET=$(grep '^CONFIG_TARGET_SUBTARGET=' "$CONFIG_FILE" | cut -d= -f2 | tr -d '"')
          if [ -z "$TARGET_BOARD" ] || [ -z "$TARGET_SUBTARGET" ]; then
            echo "Could not determine target from $CONFIG_FILE" >&2
            exit 1
          fi
          TARGET_PKG_DIR="${TARGET_BOARD}/${TARGET_SUBTARGET}"

          VERSION_CODE=$(git -C "$SOURCE_DIR" rev-parse --short HEAD)

          # Read the kernel from the target being built, not the first target
          # that happens to match in a glob (other targets use other kernels).
          KERNEL_MAKEFILE="$SOURCE_DIR/target/linux/${TARGET_BOARD}/Makefile"
          if [ ! -f "$KERNEL_MAKEFILE" ]; then
            echo "Kernel Makefile not found: $KERNEL_MAKEFILE" >&2
            exit 1
          fi
          KERNEL_VERSION=""
          if grep -q '^CONFIG_TESTING_KERNEL=y' "$CONFIG_FILE"; then
            KERNEL_VERSION=$(grep -m1 '^KERNEL_TESTING_PATCHVER:' "$KERNEL_MAKEFILE" | cut -d= -f2 | tr -d ' ' | cut -d. -f1-2)
          fi
          if [ -z "$KERNEL_VERSION" ]; then
            KERNEL_VERSION=$(grep -m1 '^KERNEL_PATCHVER:' "$KERNEL_MAKEFILE" | cut -d= -f2 | tr -d ' ' | cut -d. -f1-2)
          fi
          if [ -z "$KERNEL_VERSION" ]; then
            echo "Could not determine kernel version from $KERNEL_MAKEFILE" >&2
            exit 1
          fi
          KERNEL_VERSION=$(echo "$KERNEL_VERSION" | sed 's/[^0-9.]//g')

          PACKAGE_DIR="${{ steps.builddate.outputs.date }}_${{ inputs.firmware_name }}_${VERSION_CODE}_kernel-${KERNEL_VERSION}"
          PACKAGES_OUT="${PACKAGE_DIR}/targets/${TARGET_PKG_DIR}/packages"

          {
            echo "target_pkg_dir=$TARGET_PKG_DIR"
            echo "version_code=$VERSION_CODE"
            echo "kernel_version=$KERNEL_VERSION"
            echo "package_dir=$PACKAGE_DIR"
            echo "packages_out=$PACKAGES_OUT"
          } >> "$GITHUB_OUTPUT"

          echo "Package feed: $PACKAGES_OUT"

      - name: Patch feeds.mk for custom package repository
        if: inputs.patch_feeds_mk == true
        run: |
          cd ${{ inputs.source_dir }}

          PACKAGES_OUT="${{ steps.target.outputs.packages_out }}"
          export PACKAGES_OUT

          if [ "${{ inputs.feeds_mk_type }}" = "immortalwrt-opkg" ]; then
            # ImmortalWRT style patching with OPKG and APK links
            OPKG_LINK="${{ inputs.opkg_link }}"
            APK_LINK="${{ inputs.apk_link }}"

            # Add variables after -include line
            sed -i '/^-include $(TMP_DIR)\/.packageauxvars$/a\\nIWRT_OPKG_LINK:='"$OPKG_LINK"'\nOWRT_APK_LINK:='"$APK_LINK"'' include/feeds.mk

            # Update OPKG core package path
            sed -i "s|echo 'src/gz %d_core %U/targets/%S/packages';|echo 'src/gz %d_core %U/${PACKAGES_OUT}';|" include/feeds.mk

            # Update OPKG base package path
            sed -i "s|echo 'src/gz %d_base %U/packages/%A/base';|echo 'src/gz %d_base \${IWRT_OPKG_LINK}/packages/%A/base';|" include/feeds.mk

            # Update OPKG feed package paths
            sed -i "s|echo '\$(if \$(filter m,\$(CONFIG_FEED_\$(feed))),# )src/gz %d_\$(feed) %U/packages/%A/\$(feed)';|echo '\$(if \$(filter m,\$(CONFIG_FEED_\$(feed))),# )src/gz %d_\$(feed) \${IWRT_OPKG_LINK}/packages/%A/\$(feed)';|" include/feeds.mk

            # Update APK core package path
            sed -i "s|echo '%U/targets/%S/packages/packages.adb';|echo '%U/${PACKAGES_OUT}/packages.adb';|" include/feeds.mk

            # Update APK base package path
            sed -i "s|echo '%U/packages/%A/base/packages.adb';|echo '\${OWRT_APK_LINK}/%A/base/packages.adb';|" include/feeds.mk

            # Update APK feed package paths
            sed -i "s|echo '\$(if \$(filter m,\$(CONFIG_FEED_\$(feed))),# )%U/packages/%A/\$(feed)/packages.adb';|echo '\$(if \$(filter m,\$(CONFIG_FEED_\$(feed))),# )\${OWRT_APK_LINK}/%A/\$(feed)/packages.adb';|" include/feeds.mk

            echo "feeds.mk patched for ImmortalWRT (OPKG: $OPKG_LINK, APK: $APK_LINK)"
          else
            # OpenWRT style patching (APK only)
            # Update APK core package path
            sed -i "s|echo '%U/\$(DATE)_\$(VERSION_CODE)_\$(BRANCH)/targets/%S/packages/packages.adb';|echo '%U/${PACKAGES_OUT}/packages.adb';|" include/feeds.mk
            echo "feeds.mk patched for OpenWRT (APK)"
          fi

          if ! grep -q "$PACKAGES_OUT" include/feeds.mk; then
            echo "feeds.mk was not patched with $PACKAGES_OUT" >&2
            exit 1
          fi

      - name: Download sources
        run: |
          cd ${{ inputs.source_dir }}
          make download -j$(nproc) || { echo "Download failed"; exit 1; }
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        run: |
          cd ${{ inputs.source_dir }}
          make -j$(nproc) || make -j1 V=s

      - name: Extract version information
        id: version
        run: |
          cd ${{ inputs.source_dir }}

          # Date and version code
          DATE="${{ steps.builddate.outputs.date }}"
          VERSION_CODE="${{ steps.target.outputs.version_code }}"

          # OpenWRT version
          OPENWRT_VERSION="SNAPSHOT"
          # Try config value first
          CONFIG_VERSION=$(grep '^CONFIG_VERSION_NUMBER=' .config 2>/dev/null | cut -d= -f2 | tr -d '" ')
          if [ -n "$CONFIG_VERSION" ]; then
            OPENWRT_VERSION="$CONFIG_VERSION"
          fi
          # If config doesn't have it, try include/version.mk (literal values only, no make variable refs)
          if [ "$OPENWRT_VERSION" = "SNAPSHOT" ] && [ -f "include/version.mk" ]; then
            VERSION_FROM_FILE=$(grep -m1 '^VERSION_NUMBER:=' include/version.mk 2>/dev/null | sed -n 's/^VERSION_NUMBER:=//p' | tr -d ' ')
            # Skip if it's a make variable reference like $(CONFIG_...)
            if [ -n "$VERSION_FROM_FILE" ] && ! echo "$VERSION_FROM_FILE" | grep -q '^\$('; then
              OPENWRT_VERSION="$VERSION_FROM_FILE"
            fi
          fi

          # Kernel and target metadata were resolved before the build so the
          # package feed URL and the published directory use identical values.
          KERNEL_VERSION="${{ steps.target.outputs.kernel_version }}"
          TARGET_PKG_DIR="${{ steps.target.outputs.target_pkg_dir }}"

          # Buildinfo
          BUILD_DIR=$(find bin -maxdepth 1 -type d -name '20*_*' 2>/dev/null | head -1)
          if [ -z "$BUILD_DIR" ]; then
            BUILD_DIR=bin
          fi
          BUILDINFO=""
          if [ -n "$BUILD_DIR" ]; then
            BUILDINFO=$(cat "$BUILD_DIR/targets/"*/*/version.buildinfo 2>/dev/null | head -1 || echo "")
          fi
          BUILDINFO=${BUILDINFO:-"${DATE}-${VERSION_CODE}"}

          # Sanitize
          OPENWRT_VERSION=$(echo "$OPENWRT_VERSION" | sed 's/[^a-zA-Z0-9.-]//g')

          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "openwrt_version=$OPENWRT_VERSION" >> $GITHUB_OUTPUT
          echo "kernel_version=$KERNEL_VERSION" >> $GITHUB_OUTPUT
          echo "buildinfo=$BUILDINFO" >> $GITHUB_OUTPUT
          echo "target_pkg_dir=$TARGET_PKG_DIR" >> $GITHUB_OUTPUT

          echo "=== Build Info ==="
          echo "Date: $DATE"
          echo "Version Code: $VERSION_CODE"
          echo "OpenWRT Version: $OPENWRT_VERSION"
          echo "Kernel Version: $KERNEL_VERSION"
          echo "BuildInfo: $BUILDINFO"
          echo "Target: $TARGET_PKG_DIR"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-build-${{ steps.builddate.outputs.date }}
          path: ${{ inputs.source_dir }}/bin/
          retention-days: 7
          compression-level: 6
